{# Entrada de la barra lateral "Publicaciones recientes". Parámetro: reciente #}
<div class="recent-post">
    <a href="{% url 'blog:detalle' reciente.slug %}">
        <div class="recent-post-image">
            <span class="recent-post-date">
                {{ reciente.fecha_publicacion|date:"d"|upper }} {{ reciente.fecha_publicacion|date:"F"|upper }}
            </span>
            <img src="{{ reciente.url_imagen }}" alt="{{ reciente.titulo }}" class="img-responsive">
        </div>
        <div class="recent-post-info">
            <span><i class="fa fa-heart"></i> {{ reciente.numero_likes }}</span>
            <span><i class="fa fa-comments"></i> {{ reciente.total_comentarios }}</span>
        </div>
        <h4 class="recent-post-title">{{ reciente.titulo }}</h4>
    </a>
</div>

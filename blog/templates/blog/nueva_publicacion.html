{% extends "base.html" %}

{% block titulo %}Nueva publicación{% endblock %}

{% block contenido %}
<div id="nueva-publicacion">
    <div class="container">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
            <h1>Nueva publicación</h1>
            <form method="post">
                {% csrf_token %}
                {% include "partials/_formulario.html" %}
                <button type="submit" class="btn btn-primary pull-right">Publicar</button>
            </form>
            <hr class="divider">
        </div>
    </div>
</div>
{% endblock %}

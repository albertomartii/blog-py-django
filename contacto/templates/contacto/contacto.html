{% extends "base.html" %}

{% block titulo %}Contacto{% endblock %}

{% block contenido %}
<div id="contact" class="container" style="padding-top: 100px; padding-bottom: 80px;">
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <h2 style="font-weight: bold; margin-bottom: 30px;">Contacta con nosotros</h2>

            <form method="post">
                {% csrf_token %}
                {% include "partials/_formulario.html" %}
                <button type="submit" class="pull-right btn btn-lg sr-button">Enviar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
